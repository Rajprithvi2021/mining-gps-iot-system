name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Test the backend
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skylark_test
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Run linter
        run: cd backend && npm run lint
      
      - name: Run type checking
        run: cd backend && npm run type-check
      
      - name: Run unit tests
        run: cd backend && npm run test
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/skylark_test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info

  # Test the frontend
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      - name: Run linter
        run: cd frontend && npm run lint
      
      - name: Run unit tests
        run: cd frontend && npm run test:ci
      
      - name: Build React app
        run: cd frontend && npm run build
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/lcov.info

  # Build Docker images
  build-docker:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/skylark-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/skylark-api:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/skylark-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/skylark-api:buildcache,mode=max
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/skylark-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/skylark-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/skylark-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/skylark-frontend:buildcache,mode=max

  # Deploy to Railway
  deploy:
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Railway
        uses: railway-app/action@alpha
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: api
          environment: production
      
      - name: Deploy frontend to Railway
        uses: railway-app/action@alpha
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: frontend
          environment: production

  # Load testing
  load-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3232A
          echo "deb [signed-by=/usr/share/keyrings/grafana-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/grafana-k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run load test
        run: k6 run --vus 100 --duration 60s load-test.js
        env:
          API_URL: ${{ secrets.PRODUCTION_API_URL }}

  # Security scanning
  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      
      - name: Run OWASP dependency check (backend)
        run: |
          cd backend && npm audit --audit-level=moderate || true
      
      - name: Run OWASP dependency check (frontend)
        run: |
          cd frontend && npm audit --audit-level=moderate || true
